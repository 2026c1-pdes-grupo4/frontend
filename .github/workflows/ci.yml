name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (coverage)
        run: npm run test:coverage

      - name: Architecture tests
        run: npm run test:arch

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Explain why SonarCloud CI analysis is skipped
        if: ${{ vars.SONAR_CI_ANALYSIS_ENABLED != 'true' }}
        run: |
          echo "Skipping CI-based SonarCloud analysis."
          echo "This project currently uses SonarCloud Automatic Analysis, which conflicts with a CI-based scan."
          echo "Disable Automatic Analysis in SonarCloud and set SONAR_CI_ANALYSIS_ENABLED=true to re-enable this step."

      - name: Checkout (full history)
        if: ${{ vars.SONAR_CI_ANALYSIS_ENABLED == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        if: ${{ vars.SONAR_CI_ANALYSIS_ENABLED == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/

      - name: Run SonarCloud analysis
        if: ${{ vars.SONAR_CI_ANALYSIS_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  e2e:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend stack
        run: |
          docker network create cth-net

          docker run -d --name cth-mysql --network cth-net \
            -e MYSQL_DATABASE=cth \
            -e MYSQL_USER=cth \
            -e MYSQL_PASSWORD=1234 \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            mysql:8.4

          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if docker exec cth-mysql mysqladmin ping -h localhost -uroot -prootpass --silent; then
              echo "MySQL ready after ${i} attempts"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "MySQL never became ready"
              docker logs cth-mysql
              exit 1
            fi
            sleep 2
          done

          docker run -d --name cth-api --network cth-net -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=mysql \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://cth-mysql:3306/cth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sslMode=DISABLED" \
            -e SPRING_DATASOURCE_USERNAME=cth \
            -e SPRING_DATASOURCE_PASSWORD=1234 \
            ghcr.io/2026c1-pdes-grupo4/backend:develop

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for API (max 5 min)..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API ready after ${i} attempts"
              echo "Waiting 15s for DataInitializer to seed data..."
              sleep 15
              break
            fi
            if [ $i -eq 60 ]; then
              echo "API never became ready. Last HTTP status: ${STATUS}"
              docker logs cth-api
              exit 1
            fi
            sleep 5
          done

      - name: Run e2e tests
        run: npm run e2e:ci
        env:
          BASE_URL: http://localhost:5173
          VITE_API_URL: http://localhost:8080
          VITE_USE_FIXTURES: false
          E2E_ADMIN_USER: admin123
          E2E_ADMIN_PASS: admin123
          E2E_BUYER_USER: buyer1
          E2E_BUYER_PASS: buyer123
          E2E_AGENCY_USER: inmo1
          E2E_AGENCY_PASS: agency123

      - name: Backend logs
        if: always()
        run: docker logs cth-api

      - name: Stop backend stack
        if: always()
        run: |
          docker rm -f cth-api cth-mysql || true
          docker network rm cth-net || true

  push-image:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy (placeholder)
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy placeholder
        run: |
          echo "🚀 Deploy step pending - configure target environment"
          echo "Image: ghcr.io/${{ github.repository }}:${{ github.sha }}"
